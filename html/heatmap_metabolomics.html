<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<link href="sources/bootstrap.min.css" rel="stylesheet" />
<script src="sources/bootstrap.bundle.min.js"></script>
<script src="sources/d3.min.js"></script>
</head>
<body>

<div class="container-fluid"> <!-- max-width:1320 from bootstrap -->
  <button class="btn btn-primary" id="loadingData">
    <span class="spinner-border spinner-border-sm"></span>
    Loading..
  </button>

  <div class="row">
    <div class="col-6">    
    <!--
      <p class="h4">Hover over macula heatmap to view volcano plot for that location</p>
      <p class="h4">Click macula heatmap to freeze location and volcano plot</p>
      -->
      <div class="row">
        <div id="heatmap_effect_colorbar" class="col-1" style="display:flex; flex-wrap:wrap;"></div>
        
        <div id="heatmap_effect" class="col-11"></div>
      </div>
    </div>
    <div class="col-6">
    <!--
      <p class="h4">Hover over metabolite to view macula heatmap for metabolite</p>
      <p class="h4">Click metabolite to view and freeze macula heatmap</p>
      <div class="input-group mb-3 input-group-sm">
         <span class="input-group-text">Max P-Value:</span>
        <input type="number" class="input-sm" id="volcano_max_pval" value=1 onchange="filter_pvalue()">
      </div>
      -->
      <div class="row">
        <div id="heatmap_pvalue_colorbar" class="col-1"></div>
        
        <div id="heatmap_pvalue" class="col-11"></div>
      </div>
    </div>
  </div>  
  <div class="row">
    <div class="col-6">
      <div id="volcano"></div>
    </div>
    
    <div class="col-6">      
      <div id="horizontal_bar"></div>
    </div>
  </div>
</div>

<script>
var COLOR_LIME = "rgb(50, 205, 50)";
//var max_size = Math.min(document.body.clientWidth, 1600)/2;
var max_size = Math.min(window.innerWidth, window.innerHeight)/2;
var margin = {top: 80, right: 25, bottom: 30, left: 50},
    width = max_size - margin.left - margin.right,
    height = max_size - margin.top - margin.bottom;
var colorbar_width =margin.left+10;
var heatmap_bar_width =10;

var data;
var volcano_svg;
var bar_svg;
var heatmap_svgs = {};

var NUM_SLICES = 128;
var NUM_COORDS = 256;
var mac_xfunc = d3.scaleBand().range([ 0, width ]).domain(d3.range(1, NUM_COORDS+1));
var mac_yfunc = d3.scaleBand().range([ height, 0 ]).domain(d3.range(1, NUM_SLICES+1));
var cur_xs = 128;
var cur_ys = 64;

var vol_x;
var vol_y;
var vol_color;
var vol_s_min;
var vol_s_max;

var freeze_vol = false;
var freeze_mac = false;

var bar_mousemove;
var bar_mouseclick;
var bar_thresh = 0.05;
  
  function init_svg() {
    console.log("in init_svg");

    // set the dimensions and margins of the graph
    // append the svg object to the body of the page
    volcano_svg = d3.select("#volcano")
      .append("svg")
      .attr("width", width + margin.left + margin.right)
      .attr("height", height + margin.top + margin.bottom)
      .append("g")
      .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

    let fieldNames = ["effect", "pvalue"];
    for (let i=0; i<fieldNames.length; i++) {
      init_heatmap(fieldNames[i]);
    }
  }
  function init_heatmap(fieldName) {
    console.log("in init_heatmap; fieldName:" +fieldName);

    let domID = "#heatmap" +"_" +fieldName;
    heatmap_svgs[fieldName] = d3.select(domID)
                                .append("svg")
                                .attr("width", width + margin.left + margin.right)
                                .attr("height", height + margin.top + margin.bottom)
                                .append("g")
                                .attr("transform", "translate(" + margin.left + "," + margin.top + ")");
    
    heatmap_svgs[fieldName+"_colorbar"] = d3.select(domID +"_colorbar")
                                            .append("svg")
                                            .attr("width", colorbar_width)
                                            .attr("height", height + margin.top + margin.bottom)
                                            .append("g")
                                            .attr("transform", "translate(" + margin.left + "," + margin.top + ")");
  }

  async function render() {
    console.log("in render");

    init_svg();

    //Read the data
    console.log("before data load");
    //let fpath = "data/metabolomics_data_export/long/alldata.csv";
    let fpath = "data/metabolomics_data_export/long/alldata_v1.csv";
    data = await d3.csv(fpath, function(d) {
        document.getElementById("loadingData").style.display = "none";
        
        // NB python code swapped x,y; x should range 1-256, and y from 1-128
        return { "metabolite": d.metabolite, "y": parseInt(d.x), "x": parseInt(d.y), "logFC": parseFloat(d.logFC), "pval":parseFloat(d.PValue), "adjpval": parseFloat(d.adjPVal)};
      });
    console.log("after data load");

    vol_s_min = d3.min(d3.map(data, d=>d.logFC));
    vol_s_max = d3.max(d3.map(data, d=>d.logFC));
    render_mac("Total_C", "effect");
    render_mac("Total_C", "pvalue");
    render_volcano(cur_xs, cur_ys);
    render_bar(cur_xs, cur_ys);
  }
  
  async function render_colorbar(targetID, fieldName, sdata, cmin, cmax, mac_color, bandwidth) {
    console.log("in render_colorbar; " +targetID +"; fieldName:" +fieldName +"; ");

    const target_colorbar_svg = heatmap_svgs[targetID +"_colorbar"];
    target_colorbar_svg.selectAll("text").remove(); // cleanup

    target_colorbar_svg.append("text")
                      .attr("text-anchor", "end")
                      .attr("x", 0)
                      .attr("y", 0)
                      .text(cmax)

    target_colorbar_svg.append("text")
                      .attr("text-anchor", "end")
                      .attr("x", 0)
                      .attr("y", height + 10)
                      .text(cmin);
      
    var csv_y_fieldName = d3.map(sdata, function(d){return d[fieldName]; });  // map field values
    // Build colorbar Y scale
    var y_fieldName = d3.scaleBand()
      .range([ height, 0 ])
      .domain(d3.sort(d3.union(csv_y_fieldName)))

    target_colorbar_svg.selectAll()
      .data(sdata)
      .enter()
      .append("rect")
      .attr("x", function(d) { return 1 })
      .attr("y", function(d) { return y_fieldName(d[fieldName]) })
      .attr("width", bandwidth )
      .attr("height", y_fieldName.bandwidth() )
      .style("fill", function(d) { return mac_color(d[fieldName])} )        
      .style("opacity", function(d) { return 1- d.adjpval} )
      .style("stroke-width", 0)
      .style("stroke", function(d) { return mac_color(d[fieldName]) })
  }
  
  function make_mac_color(fieldName, cmin, cmax) {
    console.log("in make_mac_color; fieldName:" +fieldName +"; cmin:" +cmin +"; cmax:" +cmax);

    var mac_color;
    if (fieldName=='logFC') {
      mac_color = d3.scaleSequential()
                    .interpolator(d3.interpolateRdBu)
                    .domain([cmax, cmin]);
    } else {
      //mac_color.interpolator(d3.interpolateBlues)
      mac_color = d3.scaleSequential()
                    .interpolator(d3.interpolateGreys)
                    .domain([cmax, cmin]);
    }
    return mac_color;
  }

  function highlight_coord(target_svg, new_xs, new_ys) {
    console.log("in highlight_coord: ", target_svg +"; xs:" +new_xs +"; ys:" +new_ys);

    let prev_elem = target_svg.selectAll("rect[x='" +mac_xfunc(cur_xs) +"'][y='" + mac_yfunc(cur_ys) +"']");
    prev_elem.style("stroke-width", 0).style("stroke", COLOR_LIME); 
    let cur_elem = target_svg.selectAll("rect[x='" +mac_xfunc(new_xs) +"'][y='" + mac_yfunc(new_ys) +"']");
    cur_elem.style("stroke-width", 2).style("stroke", COLOR_LIME); 
  }
  function label_metabolites(d) {    
    console.log("in label_metabolites: " + d);
    if (d.adjpval<0.05) { 
      return d.metabolite; 
    } else { 
      return ""; 
    } 
  }

  async function render_mac(met, targetID) {
    console.log("in render_mac: " +"; met:" +met +"; targetID:" +targetID);

    const target_svg = heatmap_svgs[targetID];
    let fieldName="logFC";
    if (targetID=="effect") {
      fieldName="logFC";
    } else {
      fieldName="adjpval";
    }

    const sdata = d3.filter(data, d => {return d.metabolite == met});
    // var csv_x = d3.map(sdata, function(d){return d.x;});
    // var csv_y = d3.map(sdata, function(d){return d.y;});

    target_svg.append("text")
              .attr("text-anchor", "end")
              .attr("transform", "rotate(-90," +(width+15) +"," +height/2 +")")
              .attr("x", width+20)
              .attr("y", height/2)
              .text("nasal");
          
    target_svg.append("text")
              .attr("text-anchor", "end")
              .attr("transform", "rotate(-90, -5," +height/2 +")")
              .attr("x", 0)
              .attr("y", height/2)
              .text("temporal");

    target_svg.append("text")
              .attr("text-anchor", "end")
              .attr("y", -5)
              .attr("x", width/2)
              .text("superior");
    
    target_svg.append("text")
              .attr("text-anchor", "end")
              .attr("y", (height+15))
              .attr("x", width/2)
              .text("inferior");

    // Build color scale
    const cmin = d3.quantile(d3.map(sdata, d=>d[fieldName]), 0.05);
    const cmax = d3.quantile(d3.map(sdata, d=>d[fieldName]), 0.95);
    var mac_color = make_mac_color(fieldName, cmin, cmax);
    
    heatmap_bar_width = mac_xfunc.bandwidth();
    render_colorbar(targetID, fieldName, sdata, cmin, cmax, mac_color, heatmap_bar_width);
    /*
    // create a tooltip
    var tooltip = d3.select("#heatmap")
      .append("div")
      .style("fill-opacity", 0)
      .attr("class", "tooltip")
      .style("background-color", "white")
      .style("border", "solid")
      .style("border-width", "2px")
      .style("border-radius", "5px")
      .style("padding", "5px")
      */
    
    var mousemove = function(e, d) {
      console.log("in mousemove: ", d, "; freeze_mac:" +freeze_mac, "; freeze_vol:" +freeze_vol);

      freeze_mac = false;
      if (! freeze_vol) {
        highlight_coord(heatmap_svgs["effect"], d.x, d.y);
        highlight_coord(heatmap_svgs["pvalue"], d.x, d.y);        
        // update to show on macula heatmaps
        cur_xs = d.x;
        cur_ys = d.y;
        change_volcano(d.x, d.y); 
        change_bar(d.x, d.y);
      }
    }

    var mouseclick = function(e, d) {
      console.log("in mouseclick: ", d, "; freeze_mac:" +freeze_mac, "; freeze_vol:" +freeze_vol);

      freeze_mac = false;
      if (freeze_vol) { 
        freeze_vol = false;
      } else { 
        freeze_vol = true; 
      }
      volcano_svg.selectAll("#title")
                 .text(make_volcano_msg(d.x, d.y));
      bar_svg.selectAll("#title")
             .text(make_bar_msg(d.x, d.y));
    }

    // add the squares
    target_svg.selectAll()
      .data(sdata, function(d) {return d.x+':'+d.y;})
      .enter()
      .append("rect")
      .attr("x", function(d) { return mac_xfunc(d.x) })
      .attr("y", function(d) { return mac_yfunc(d.y) })
      .attr("width", mac_xfunc.bandwidth() )
      .attr("height", mac_yfunc.bandwidth() )
      .style("fill", function(d) { return mac_color(d[fieldName])} )
      .style("opacity", function(d) { return 1- d.adjpval} )
      .style("stroke-width", 0)
      .style("stroke", function(d) { return mac_color(d[fieldName])} )
      .on("mousemove", mousemove)
      .on("mousedown", mouseclick)
    
    highlight_coord(target_svg, cur_xs, cur_ys);

    // Add title to graph
    target_svg.append("text")
      .attr("id", "title")
      .attr("x", 0)
      .attr("y", -50)
      .attr("text-anchor", "left")
      //.style("font-size", "22px")
      .attr("class", "h5")
      .text(make_macula_msg(met, fieldName));
  }

	async function render_volcano(xs, ys) {
    console.log("in render_volcano: ", "; xs:" +xs, "; ys:" +ys);

    var sdata = d3.filter(data, d => {return d.x == xs && d.y == ys});

    //var csv_x = d3.map(sdata, function(d){return d.logFC;})
    //var csv_y = d3.map(sdata, function(d){return d.adjpval;})
    // sanity checks
    console.log(d3.max(d3.map(data, d=>{return d.x})));
    console.log(d3.max(d3.map(data, d=>{return d.y})));

    volcano_svg.append("text")
              .attr("text-anchor", "end")
              .attr("x", width+10)
              .attr("y", height + 25)
              .text("Effect Size");

    volcano_svg.append("text")
              .attr("text-anchor", "end")
              .attr("transform", "rotate(-90)")
              .attr("y", -margin.left+10)
              .attr("x", -margin.top+85)
              .text("adjusted p-value")

    var vol_mousemove = function(e, d) {
      console.log("in vol_mousemove: ", d, "; freeze_mac:" +freeze_mac, "; freeze_vol:" +freeze_vol);

      freeze_vol = false;
      if (! freeze_mac) { 
        change_macula(d.metabolite, "effect"); 
        change_macula(d.metabolite, "pvalue"); 
      }
    }
    var vol_mouseclick = function(e, d) {
      console.log("in vol_mouseclick: ", d, "; freeze_mac:" +freeze_mac, "; freeze_vol:" +freeze_vol);

      freeze_vol = false;
      if (freeze_mac) { 
        freeze_mac = false; 
      } else { 
        freeze_mac = true; 
      }
      heatmap_svgs["effect"].selectAll("#title")
                            .text(make_macula_msg(d.metabolite, "logFC"));
      heatmap_svgs["pvalue"].selectAll("#title")
                            .text(make_macula_msg(d.metabolite, "pvalue"));
    }

    // Build Y scales and axis:
    vol_x = d3.scaleLinear()
      .range([ 0, width ])
      .domain([vol_s_min, vol_s_max])
    
    // let max_pval = parseFloat(document.getElementById("volcano_max_pval").value);
    let max_pval = 1;
    vol_y = d3.scalePow()
              .exponent(0.1)
              .range([ height, 0 ])
              .domain([max_pval, 0.0])
    /* too skewed by Number.MIN_VALUE or cmin
    vol_y = d3.scaleLog()
      .range([ height, 0 ])
      .domain([max_pval, Number.MIN_VALUE])
    */
          
    volcano_svg.append("g")
              .attr("id", "xaxis")
              .attr("transform", "translate(0," + height + ")")
              .call(d3.axisBottom(vol_x));      
    volcano_svg.append("g")
              .attr("id", "yaxis")
              .call(d3.axisLeft(vol_y));

    // Build color scale
    const cmin = d3.quantile(d3.map(sdata, d=>d.adjpval), 0.05);
    const cmax = d3.quantile(d3.map(sdata, d=>d.adjpval), 0.95);
    console.log("cmin:" +cmin)
    console.log("cmax:" +cmax)
    // 1 color shade and different heatmap colors!
    vol_color = d3.scaleSequential()
      .interpolator(d3.interpolateBlues)
      .domain([cmax, Number.MIN_VALUE]);

    volcano_svg.append('g')
        .selectAll("dot")
        .data(sdata)
        .enter()
        .append("text")
          .attr("class", "scattertext")
          .attr("x", function (d) { return vol_x(d.logFC) + 5; } )
          .attr("y", function (d) { return vol_y(d.adjpval) - 5; } )
          .attr("text-anchor", "start")
      .attr("transform", d => "rotate(-45 " + vol_x(d.logFC) + " " + vol_y(d.adjpval) + " ) ")
      .text(label_metabolites)

    volcano_svg.append('g')
        .selectAll("dot")
        .data(sdata)
        .enter()
        .append("circle")
          .attr("cx", function (d) { return vol_x(d.logFC); } )
          .attr("cy", function (d) { return vol_y(d.adjpval); } )
          .attr("r", 5)
          .style("fill", d=> vol_color(d.adjpval))
      .on("mousemove", vol_mousemove)
      .on("mousedown", vol_mouseclick);
    
    // Add title to graph
    volcano_svg.append("text")
      .attr("id", "title")
      .attr("x", 0)
      .attr("y", -50)
      .attr("text-anchor", "left")
      //.style("font-size", "22px")
      .attr("class", "h5")
      .text(make_volcano_msg(xs, ys));
  }

  function make_macula_msg(met, fieldName) {
    let display_text = fieldName=="logFC" ? "Effect Size":"p-value";
    let msg = "Heatmap of " +display_text +" on Macula by " +met;
    if (freeze_mac) {
      msg += " (Locked - click a metabolite to unlock)";
    }
    return msg;
  }
  function make_volcano_msg(xs, ys) {
    cur_xs = xs;
    cur_ys = ys;
    let msg = "Volcano for grid location: " +xs +", " +ys;
    if (freeze_vol) {
      msg += " (Locked - click a heatmap to unlock)";
    }
    return msg;
  }
  function make_bar_msg(xs, ys) {
    cur_xs = xs;
    cur_ys = ys;
    let msg = "Bar for grid location: " +xs +", " +ys;
    if (freeze_vol) {
      msg += " (Locked - click a heatmap to unlock)";
    }
    return msg;
  }

  function change_volcano(xs, ys) {
    console.log("in change_volcano; xs:" +xs, "; ys:" +ys);

    //let max_pval = parseFloat(document.getElementById("volcano_max_pval").value);
    let max_pval= 1;    
    vol_y = d3.scalePow()
              .exponent(0.1)
              .range([ height, 0 ])
              .domain([max_pval, 0.0])

    volcano_svg.select("g#yaxis")
        .call(d3.axisLeft(vol_y));
    volcano_svg.append("text")
          .attr("text-anchor", "end")
          .attr("transform", "rotate(-90)")
          .attr("y", -margin.left+10)
          .attr("x", -margin.top+85)
          .text("adjusted p-value")

    volcano_svg.selectAll("#title")
      .text(make_volcano_msg(xs, ys));
    
    const sdata = d3.filter(data, d => {return d.x == xs && d.y == ys && d.adjpval < max_pval});
    volcano_svg.selectAll("circle")
        .data(sdata)
        .join()
          .attr("cx", function (d) { return vol_x(d.logFC); } )
          .attr("cy", function (d) { return vol_y(d.adjpval); } )
          .attr("r", 5)
      .style("fill", d=> vol_color(d.adjpval));

    volcano_svg.selectAll(".scattertext")
        .data(sdata)
        .join()
          .attr("x", function (d) { return vol_x(d.logFC) + 5; } )
          .attr("y", function (d) { return vol_y(d.adjpval) - 5; } )
          .attr("transform", d => "rotate(-45 " + vol_x(d.logFC) + " " + vol_y(d.adjpval) + " ) ")
          .text(label_metabolites)
	}

	function change_macula(met, targetID) {
    console.log("in change_macula; met:" +met, "; targetID:" +targetID);

    const target_svg = heatmap_svgs[targetID];
    let fieldName="logFC";
    if (targetID=="effect") {
      fieldName="logFC";
    } else {
      fieldName="adjpval";
    }

    target_svg.selectAll("#title")
              .text(make_macula_msg(met, fieldName));
    let sdata;
    if (met !=null) {
      sdata = d3.filter(data, d => {return d.metabolite == met});
    } else {
      sdata = data;
    }

    // Build color scale
    const cmin = d3.quantile(d3.map(sdata, d=>d[fieldName]), 0.05);
    const cmax = d3.quantile(d3.map(sdata, d=>d[fieldName]), 0.95);
    var mac_color = make_mac_color(fieldName, cmin, cmax);

    target_svg.selectAll("rect")
        .data(sdata)
        .join()
        .style("fill", d=> mac_color(d[fieldName]))
        .style("fill-opacity", function(d) { return 1- d.adjpval} )
        .style("stroke-width", 0)
        .style("stroke", function(d) { return mac_color(d[fieldName]) })
            
    highlight_coord(target_svg, cur_xs, cur_ys);
    render_colorbar(targetID, fieldName, sdata, cmin, cmax, mac_color, heatmap_bar_width);
  }

  async function render_bar(xs, ys) {
    console.log("in render_bar; xs:" +xs, "; ys:" +ys);

    // append the svg object to the body of the page
    bar_svg = d3.select("#horizontal_bar")
                .append("svg")
                .attr("width", width + margin.left + margin.right)
                .attr("height", height + margin.top + margin.bottom)
                .append("g")
                .attr("transform", "translate(" + margin.left + "," + margin.top + ")");    
  
    // only significant metabolites and sorted
    let fieldName = "logFC";
    let data_filtered = d3.filter(data, d => {return d.x == xs && d.y == ys && d.adjpval < bar_thresh} );
    let data_filtered_sorted = data_filtered.sort((a, b) => -a[fieldName] + b[fieldName] );

    // Add X axis - same as volcano
    bar_svg.append("g")
          .classed('x-axis', true)
          .attr("transform", "translate(0," + height + ")")
          .call(d3.axisBottom(vol_x))
          .selectAll("text")
          .attr("transform", "translate(-10,0)rotate(-45)")
          .style("text-anchor", "end");

    // Y axis
    var y = d3.scaleBand()
              .range([ 0, height ])
              .domain(data_filtered_sorted.map(function(d) { return d.metabolite; }))
              //.padding(.1);
    
    bar_svg.append("g")
      .classed('y-axis', true)
      .call(d3.axisLeft(y));
       
    // Build color scale
    const cmin = d3.quantile(d3.map(data_filtered_sorted, d=>d[fieldName]), 0.05);
    const cmax = d3.quantile(d3.map(data_filtered_sorted, d=>d[fieldName]), 0.95);
    var mac_color = make_mac_color(fieldName, cmin, cmax);

    // Bars
    bar_svg.append("text")
              .attr("text-anchor", "end")
              .attr("x", width+10)
              .attr("y", height + 25)
              .text("Effect Size");
    
    // Add title to graph
    bar_svg.append("text")
      .attr("id", "title")
      .attr("x", 0)
      .attr("y", -50)
      .attr("text-anchor", "left")
      .attr("class", "h5")
      .text(make_bar_msg(xs, ys));

    // event handlers
    bar_mousemove = function(e, d) {
      console.log("in bar_mousemove: ", d, "; freeze_mac:" +freeze_mac, "; freeze_vol:" +freeze_vol);

      freeze_vol = false;
      if (! freeze_mac) { 
        change_macula(d.metabolite, "effect"); 
        change_macula(d.metabolite, "pvalue"); 
      }
    }
    bar_mouseclick = function(e, d) {
      console.log("in bar_mouseclick: ", d, "; freeze_mac:" +freeze_mac, "; freeze_vol:" +freeze_vol);

      freeze_vol = false;
      if (freeze_mac) { 
        freeze_mac = false; 
      } else { 
        freeze_mac = true; 
      }
      heatmap_svgs["effect"].selectAll("#title")
                            .text(make_macula_msg(d.metabolite, "logFC"));
      heatmap_svgs["pvalue"].selectAll("#title")
                            .text(make_macula_msg(d.metabolite, "pvalue"));
    } 

    bar_svg.selectAll("myRect")
      .data(data_filtered_sorted)
      .enter()
      .append("rect")
      .attr("y", function(d) { return y(d.metabolite); })
      .attr("height", y.bandwidth() )
      .attr("x", function(d) { 
        if (d[fieldName]>0) {
          return vol_x(0);
        } else {
          return vol_x(d[fieldName]); 
        }
      })
      .attr("width", function(d) { 
        if (d[fieldName]>0) { 
          return vol_x(d[fieldName]) - vol_x(0); 
        } else {
          return -(vol_x(d[fieldName]) - vol_x(0)); 
        }
      })
      .style("fill", function(d) { return mac_color(d[fieldName])} )
      .style("opacity", function(d) { return 1- d.adjpval} )      
      .on("mousemove", bar_mousemove)
      .on("mousedown", bar_mouseclick)
  }
  function change_bar(xs, ys) {
    console.log("in change_bar; xs:" +xs, "; ys:" +ys);
    
    // change title
    bar_svg.selectAll("#title")
      .text(make_bar_msg(xs, ys));
    
    // only significant metabolites and sorted
    let fieldName = "logFC";
    let data_filtered = d3.filter(data, d => {return d.x == xs && d.y == ys && d.adjpval < bar_thresh} );
    let data_filtered_sorted = data_filtered.sort((a, b) => -a[fieldName] + b[fieldName] );

    // Y axis
    var y = d3.scaleBand()
              .range([ 0, height ])
              .domain(data_filtered_sorted.map(function(d) { return d.metabolite; }))
              //.padding(.1);
    
    bar_svg.selectAll(".y-axis").remove();
    bar_svg.append("g")
      .classed('y-axis', true)
      .call(d3.axisLeft(y));    
       
    // Build color scale
    const cmin = d3.quantile(d3.map(data_filtered_sorted, d=>d[fieldName]), 0.05);
    const cmax = d3.quantile(d3.map(data_filtered_sorted, d=>d[fieldName]), 0.95);
    var mac_color = make_mac_color(fieldName, cmin, cmax);    
    
    // remove everything and then add?
    bar_svg.selectAll("rect").remove()
    bar_svg.selectAll("myRect")
      .data(data_filtered_sorted)
      .enter()
      .append("rect")
      .attr("y", function(d) { return y(d.metabolite); })
      .attr("height", y.bandwidth() )
      .attr("x", function(d) { 
        if (d[fieldName]>0) {
          return vol_x(0);
        } else {
          return vol_x(d[fieldName]); 
        }
      })
      .attr("width", function(d) { 
        if (d[fieldName]>0) { 
          return vol_x(d[fieldName]) - vol_x(0); 
        } else {
          return -(vol_x(d[fieldName]) - vol_x(0)); 
        }
      })
      .style("fill", function(d) { return mac_color(d[fieldName])} )
      .style("opacity", function(d) { return 1- d.adjpval} )      
      .on("mousemove", bar_mousemove)
      .on("mousedown", bar_mouseclick)
	}

render();
