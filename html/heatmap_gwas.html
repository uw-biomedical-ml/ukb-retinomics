<script>
var COLOR_LIME = "rgb(50, 205, 50)";
//var max_size = Math.min(document.body.clientWidth, 1600)/2;
var max_size = Math.min(window.innerWidth, window.innerHeight)/2;
var margin = {top: 80, right: 70, bottom: 30, left: 40},
    width = max_size - margin.left - margin.right,
    height = max_size - margin.top - margin.bottom;
console.log(width +";" +height);
var colorbar_width = margin.left+10;
var heatmap_bar_width =10;

var thickness_data;
var snip_info_data;
var snip_info_dict = {};
var loc_data;
var snip_data;
var snips_summary_data;
var heatmap_svgs = {};
var manhattan_svgs = {};

var NUM_SLICES = 128;
var NUM_COORDS = 256;
var NUM_GRID_POINTS = 29274;
var PIXEL_TO_MICRONS_THICKNESS = (2.275*1000)/650 / 1000000;
var CHR_NUM_SLIPS_DICT = {"1": 842491, "2":913413, "3":774528, "4":796789, "5":706769, "6":733026, "7":639645, "8":600401, "9":468652, "10":553430, "11":539166, "12":524442, "13":398578, "14":353816, "15":309546, "16":335728, "17":293820, "18":309206, "19":252330, "20":240886, "21":148455, "22":149315, "X":354574};

var mac_xfunc = d3.scaleBand().range([ 0, width ]).domain(d3.range(1, NUM_COORDS+1));
//var mac_xfunc2 = d3.scaleBand().range([ 0, width ]).domain(d3.sort(d3.union(d3.range(1, NUM_COORDS+1), [NUM_COORDS/2-NUM_COORDS/6, NUM_COORDS/2-NUM_COORDS/12, NUM_COORDS/6, NUM_COORDS/12])));
var mac_xfunc2 = d3.scaleLinear().range([ 0, width ]).domain([1, NUM_COORDS]);
var mac_yfunc = d3.scaleBand().range([ 0, height ]).domain(d3.range(1, NUM_SLICES+1));
var mac_yfunc2 = d3.scaleLinear().range([ 0, height ]).domain([1, NUM_SLICES]);

var cur_chr = 22;
var cur_snip = "rs9330813";
// NB python code swapped x,y; x should range 1-256, and y from 1-128
var cur_xs = 76;
var cur_ys = 62;

var chr_base = d3.range(1,23);
chr_base.push('X');
var manhattan_x;
var manhattan_y;
var manhattan_color;
var manhattan_thresh = 5e-8 / 119 / 246;

var freeze_manhattan = false;
var freeze_mac = false;
  
  function init_svg() {
    console.log("in init_svg");

    // set the dimensions and margins of the graph
    // append the svg object to the body of the page    
    let resolutions = ["full", "zoom"];
    for (let j=0; j<resolutions.length; j++) {
      init_manhattan(resolutions[j]);
    }

    let fieldNames = ["beta", "pvalue", "meanThick"];
    for (let i=0; i<fieldNames.length; i++) {
      init_heatmap(fieldNames[i]);
    }
  }
  function init_manhattan(resolution) {
    console.log("in init_heatmap; resolution:" +resolution);

    let domID = "#manhattan" +"_" +resolution;
    manhattan_svgs[resolution] = d3.select(domID)
                                    .append("svg")
                                    .attr("width", width + margin.left + margin.right)
                                    .attr("height", height + margin.top + margin.bottom)
                                    .append("g")
                                    .attr("transform", "translate(" + margin.left + "," + margin.top + ")");
  }
  function init_heatmap(fieldName) {
    console.log("in init_heatmap; fieldName:" +fieldName);

    let domID = "#heatmap" +"_" +fieldName;
    heatmap_svgs[fieldName] = d3.select(domID)
                                .append("svg")
                                .attr("width", width + margin.left + margin.right)
                                .attr("height", height + margin.top + margin.bottom)
                                .append("g")
                                .attr("transform", "translate(" + margin.left + "," + margin.top + ")");
    
    heatmap_svgs[fieldName+"_colorbar"] = d3.select(domID +"_colorbar")
                                            .append("svg")
                                            .attr("width", colorbar_width)
                                            .attr("height", height + margin.top + margin.bottom)
                                            .append("g")
                                            .attr("transform", "translate(" + margin.left + "," + margin.top + ")");
  }
  async function get_data() {
    let fpath = "data/chr" +cur_chr +"/sigSNPs/snip_info_" +cur_chr +".csv";
    snip_info_data = await d3.csv(fpath, function(d) {
      return { "snip": d.snip, "chr": d.chr, "pos": parseInt(d.pos), "A1":d.A1 };
    });
    snip_info_data.forEach(d => snip_info_dict[d.snip] = {"pos":d.pos, "A1":d.A1, "chr":d.chr} );

    await get_thickness_data();
    await get_snip_data();
    await get_loc_data();
  }
  async function get_thickness_data() {
    let fpath = "data/mean_thickness.csv";
    thickness_data = await d3.csv(fpath, function(d) {
      return { "y": parseInt(d.slice_num)+1, "x": parseInt(d.coord_num)+1, "meanThick": parseFloat(d.mean_thick)*PIXEL_TO_MICRONS_THICKNESS, "stdThick": parseFloat(d.std_thick)*PIXEL_TO_MICRONS_THICKNESS, "medianThick":parseFloat(d.median_thick)*PIXEL_TO_MICRONS_THICKNESS };
    });
  }
  async function get_loc_data() {
    document.getElementById("loadingData").style.display = "inherit";

    // NB python code swapped x,y; x should range 1-256, and y from 1-128
    /* let fpath = "data/location_summary/location_summary_" +cur_ys +"_" +cur_xs +".csv";
    loc_data = await d3.csv(fpath, function(d) {
      return { "snip": d.snip, "chr": d.chr, "pos": parseInt(d.pos), "beta": parseFloat(d.beta), "pvalue":parseFloat(d.pvalue) };
    });
    */
    let fpath = "data/chr" +cur_chr +"/sigSNPs/slice" +cur_ys +"_result.txt";
    loc_data = await d3.csv(fpath, function(d) {
      return { "snip": d.ID, "chr": cur_chr, "pos": parseInt(d.POS), "A1":d.A1, "beta": parseFloat(d[cur_ys +"_" +cur_xs +"_BETA"]), "pvalue": parseFloat(d[cur_ys +"_" +cur_xs +"_P"]) };
    });

    document.getElementById("loadingData").style.display = "none";
  }
  async function get_snip_data() {    
    document.getElementById("loadingData").style.display = "inherit";
    let cur_snip_safe = cur_snip.includes(":") ? cur_snip.split(":")[1]:cur_snip;
    let fpath = "data/chr" +cur_chr +"/sigSNPs/long/" +cur_snip_safe +".csv";
    snip_data = await d3.csv(fpath, function(d) {
      // NB python code swapped x,y; x should range 1-256, and y from 1-128
      return { "y": parseInt(d.slice_num), "x": parseInt(d.coord_num), "beta": parseFloat(d.beta), "pvalue":parseFloat(d.pval) };
    });

    document.getElementById("loadingData").style.display = "none";
  }

  async function render() {
    console.log("in render");

    init_svg();

    //load data
    console.log("before data load");
    await get_data();
    console.log("after data load");

    render_mac(cur_snip, "beta");
    render_mac(cur_snip, "pvalue");
    render_mac(null, "meanThick")
    render_manhattan(cur_xs, cur_ys);
    render_manhattan(cur_xs, cur_ys, cur_snip);
    
    // FIXME - get chromosome wide summary
    let fpath = "data/chr" +cur_chr +"/sigSNPs/chr_snip.csv";
    snips_summary_data = await d3.csv(fpath, function(d) {
      return { "chr": d.chr, "snip": d.snip, "num_sig": parseInt(d.num_sig), "num_sig_strict":parseInt(d.num_sig_strict) };
    });
  }
  async function render_colorbar(targetID, fieldName, sdata, cmin, cmax, mac_color, bandwidth) {
    console.log("in render_colorbar; " +targetID +"; fieldName:" +fieldName +"; ");

    const target_colorbar_svg = heatmap_svgs[targetID +"_colorbar"];
    target_colorbar_svg.selectAll("text").remove(); // cleanup

    const cmax_transformed = cmax;
    const cmin_transformed = cmin;
    let suffix = "";
    let num_format;
    switch (fieldName) {
      case "pvalue":
        num_format = ".0e";
        break;
      case "beta":
        num_format = ".2f";
        break;
      case "meanThick":
        num_format = ".2s";
        suffix = "m";
        break;
    }

    target_colorbar_svg.append("text")
                      .attr("text-anchor", "end")
                      .attr("x", fieldName=="meanThick" ? 15:10)
                      .attr("y", 0)
                      .text(d3.format(num_format)(cmax_transformed)+suffix)

    target_colorbar_svg.append("text")
                      .attr("text-anchor", "end")
                      .attr("x", fieldName=="meanThick" ? 15:10)
                      .attr("y", height + 10)
                      .text(d3.format(num_format)(cmin_transformed)+suffix);
      
    var csv_y_fieldName = d3.map(sdata, function(d){return d[fieldName]; });  // map field values
    // Build colorbar Y scale
    var y_fieldName = d3.scaleBand()
      .range([ height, 0 ])
      .domain(d3.sort(d3.union(csv_y_fieldName)))

    target_colorbar_svg.selectAll()
      .data(sdata)
      .enter()
      .append("rect")
      .attr("x", function(d) { return 1 })
      .attr("y", function(d) { return y_fieldName(d[fieldName]) })
      .attr("width", bandwidth )
      .attr("height", y_fieldName.bandwidth() )
      .style("fill", d=> extract_macula_heatmap_data(d, mac_color, fieldName) )
      .style("opacity", function(d) { return 1- d.pvalue} )
      .style("stroke-width", 0)
      .style("stroke", d=> extract_macula_heatmap_data(d, mac_color, fieldName) )
  }
  function extract_macula_heatmap_data(d, mac_color, fieldName) {
    if (fieldName=='pvalue') {
      return mac_color(Math.log10(d[fieldName]));
    } else {
      return mac_color(d[fieldName]);
    }
  }
  
  function make_mac_color(fieldName, cmin, cmax) {
    console.log("in make_mac_color; fieldName:" +fieldName +"; cmin:" +cmin +"; cmax:" +cmax);

    var mac_color;
    if (fieldName=="pvalue") {
      // log scale colors - https://gist.github.com/RobinL/6b27f9abc591002779d294f1fdff6b72
      mac_color = d3.scaleSequential()
                    //.interpolator(d3.interpolateGreys)
                    .interpolator(d3.interpolateCividis)
                    .domain([Math.log10(cmax), Math.log10(cmin)]);
    } else {
      mac_color = d3.scaleSequential()
                    .interpolator(d3.interpolateRdBu)
                    .domain([cmax, cmin]);
    }
    return mac_color;
  }

  function highlight_coord(target_svg, new_xs, new_ys) {
    console.log("in highlight_coord: ", target_svg +"; xs:" +new_xs +"; ys:" +new_ys);

    let prev_elem = target_svg.selectAll("rect[x='" +mac_xfunc(cur_xs) +"'][y='" + mac_yfunc(cur_ys) +"']");
    prev_elem.style("stroke-width", 0).style("stroke", COLOR_LIME); 
    let cur_elem = target_svg.selectAll("rect[x='" +mac_xfunc(new_xs) +"'][y='" + mac_yfunc(new_ys) +"']");
    cur_elem.style("stroke-width", 2).style("stroke", COLOR_LIME); 
  }

  function drawETDRS(targetID) {
    const target_svg = heatmap_svgs[targetID];
    // 3 circles
    var radii = [NUM_SLICES/2, NUM_SLICES/4, NUM_SLICES/12];
    for (let rdx=0; rdx<radii.length; rdx++) {
      target_svg.append("circle")
                .attr("cx", mac_xfunc2(NUM_COORDS/2))
                .attr("cy", mac_yfunc2(NUM_SLICES/2))
                //.attr("r", mac_xfunc2(NUM_COORDS/2))
                .attr("r", mac_yfunc2(radii[rdx]))
                .style("stroke","black")
                .style("stroke-width", 1)
                .style("opacity", 1)
                .style("fill-opacity",0)
    }

    // 4 lines
    //const l1 = d3.line()([ [mac_xfunc2(1), mac_yfunc(NUM_SLICES/2)], [mac_xfunc2(NUM_COORDS/2-NUM_COORDS/12), mac_yfunc(NUM_SLICES/2)] ]);
    const l1 = d3.line()([ [mac_xfunc2(NUM_COORDS/2)-mac_yfunc2(NUM_SLICES/2), mac_yfunc2(NUM_SLICES/2)], [mac_xfunc2(NUM_COORDS/2)-mac_yfunc2(NUM_SLICES/12), mac_yfunc2(NUM_SLICES/2)] ]);
    const rotations = [45, 135, 225, 315];
    for (let rdx=0; rdx<rotations.length; rdx++) {
      target_svg.append("path")
                .attr("d",l1)
                .attr("stroke", "black")
                .attr("stroke-width", 1)
                .attr("transform", `rotate(${rotations[rdx]}, ${mac_xfunc2(NUM_COORDS/2)} ${mac_yfunc2(NUM_SLICES/2)})`)
    }
  }
  async function render_mac(snip, targetID) {
    console.log("in render_mac; snip:" +snip +"; targetID:" +targetID);

    const target_svg = heatmap_svgs[targetID];
    let fieldName= targetID;  // alias
    
    const sdata = targetID=="meanThick" ? thickness_data:snip_data;

    target_svg.append("text")
              .attr("text-anchor", "end")
              .attr("transform", "rotate(-90," +(width+15) +"," +height/2 +")")
              .attr("x", width+20)
              .attr("y", height/2)
              .text("nasal");
          
    target_svg.append("text")
              .attr("text-anchor", "end")
              .attr("transform", "rotate(-90, -5," +height/2 +")")
              .attr("x", 0)
              .attr("y", height/2)
              .text("temporal");

    target_svg.append("text")
              .attr("text-anchor", "end")
              .attr("y", -5)
              .attr("x", width/2)
              .text("superior");
    
    target_svg.append("text")
              .attr("text-anchor", "end")
              .attr("y", (height+15))
              .attr("x", width/2)
              .text("inferior");

    // Build color scale
    const cmin = d3.quantile(d3.map(sdata, d=>d[fieldName]), 0.05);
    const cmax = d3.quantile(d3.map(sdata, d=>d[fieldName]), 0.95);
    var mac_color = make_mac_color(fieldName, cmin, cmax);
    
    heatmap_bar_width = mac_xfunc.bandwidth();
    render_colorbar(targetID, fieldName, sdata, cmin, cmax, mac_color, heatmap_bar_width);
    drawETDRS(targetID);
    
    var mousemove = function(e, d) {
      console.log("in mousemove: ", d, "; freeze_mac:" +freeze_mac, "; freeze_manhattan:" +freeze_manhattan);

      freeze_mac = false;
      if (! freeze_manhattan) {
        highlight_coord(heatmap_svgs["beta"], d.x, d.y);
        highlight_coord(heatmap_svgs["pvalue"], d.x, d.y);
        highlight_coord(heatmap_svgs["meanThick"], d.x, d.y);
        // update to show on macula heatmaps
        cur_xs = d.x;
        cur_ys = d.y;
        change_manhattan(d.x, d.y); 
        // FIXME find representative snip for zoom in
      }
    }

    var mouseclick = function(e, d) {
      console.log("in mouseclick: ", d, "; freeze_mac:" +freeze_mac, "; freeze_manhattan:" +freeze_manhattan);

      freeze_mac = false;
      if (freeze_manhattan) { 
        freeze_manhattan = false;
      } else { 
        freeze_manhattan = true; 
      }
      manhattan_svgs["full"].selectAll("#title")
                           .text(make_manhattan_msg(d.x, d.y));
      manhattan_svgs["zoom"].selectAll("#title")
                           .text(make_manhattan_msg(d.x, d.y));
    }

    // add the squares - Use defined X scales and axis
    target_svg.selectAll()
      .data(sdata, function(d) {return d.x+':'+d.y;})
      .enter()
      .append("rect")
      .attr("x", function(d) { return mac_xfunc(d.x) })
      .attr("y", function(d) { return mac_yfunc(d.y) })
      .attr("width", mac_xfunc.bandwidth() )
      .attr("height", mac_yfunc.bandwidth() )
      .style("fill", d => extract_macula_heatmap_data(d, mac_color, fieldName) )
      .style("opacity", function(d) { return 1- d.pvalue} )
      .style("stroke-width", 0)
      .style("stroke", d => extract_macula_heatmap_data(d, mac_color, fieldName) )
      .on("mousemove", mousemove)
      .on("mousedown", mouseclick)
    
    highlight_coord(target_svg, cur_xs, cur_ys);

    // Add title to graph
    target_svg.append("text")
      .attr("id", "title")
      .attr("x", 0)
      .attr("y", -50)
      .attr("text-anchor", "left")
      //.style("font-size", "22px")
      .attr("class", "h5")
      .text(make_macula_msg(snip, fieldName));
  }

	async function change_macula(snip, targetID) {
    console.log("in change_macula; snip:" +snip, "; targetID:" +targetID);

    const target_svg = heatmap_svgs[targetID];
    let fieldName = targetID;

    target_svg.selectAll("#title")
              .text(make_macula_msg(snip, fieldName));
    
    // get new snip data
    if (fieldName!="meanThick") { // only highlight new coord if meanThick
      cur_snip = snip;
      await get_snip_data();
      let sdata = snip_data;

      // Build color scale
      const cmin = d3.quantile(d3.map(sdata, d=>d[fieldName]), 0.05);
      const cmax = d3.quantile(d3.map(sdata, d=>d[fieldName]), 0.95);
      var mac_color = make_mac_color(fieldName, cmin, cmax);

      target_svg.selectAll("rect")
          .data(sdata)
          .join()
          .style("fill", d=> mac_color(d[fieldName]))
          .style("fill-opacity", function(d) { return 1- d.pvalue} )
          .style("stroke-width", 0)
          .style("stroke", function(d) { return mac_color(d[fieldName]) })

      render_colorbar(targetID, fieldName, sdata, cmin, cmax, mac_color, heatmap_bar_width);
    }
    highlight_coord(target_svg, cur_xs, cur_ys);
  }

	async function render_manhattan(xs, ys, snip=null) {
    console.log("in render_manhattan: ", "; xs:" +xs, "; ys:" +ys);

    // when rendering/changing manhattan
    cur_xs = xs;
    cur_ys = ys;
    await get_loc_data();
    var sdata = loc_data;

    var target_suffix = snip==null ? "full":"zoom";
    var manhattan_svg = manhattan_svgs[target_suffix]
    if (snip!=null) {
      let cur_snip_info = snip_info_dict[snip];
      sdata = d3.filter(loc_data, d => { return Math.abs(d.pos - cur_snip_info.pos) < 500000 });
    }

    var csv_x = d3.map(sdata, function(d){return d.chr;})
    var csv_y = d3.map(sdata, function(d){return d.pvalue;})

    manhattan_svg.append("text")
                 .attr("text-anchor", "end")
                 .attr("x", width+10)
                 .attr("y", height + 25)
                 .text("Chromosome");

    manhattan_svg.append("text")
                 .attr("text-anchor", "end")
                 .attr("transform", "rotate(-90)")
                 .attr("y", -margin.left+10)
                 .attr("x", -margin.top+85)
                 .text("p-value")

    var manhattan_mousemove = function(e, d) {
      console.log("in manhattan_mousemove: ", d, "; freeze_mac:" +freeze_mac, "; freeze_manhattan:" +freeze_manhattan);

      freeze_manhattan = false;
      if (! freeze_mac) { 
        change_macula(d.snip, "beta"); 
        change_macula(d.snip, "pvalue"); 
        change_manhattan(xs, ys, d.snip);
      }
    }
    var manhattan_mouseclick = function(e, d) {
      console.log("in manhattan_mouseclick: ", d, "; freeze_mac:" +freeze_mac, "; freeze_manhattan:" +freeze_manhattan);

      freeze_manhattan = false;
      if (freeze_mac) { 
        freeze_mac = false; 
      } else { 
        freeze_mac = true; 
      }
      heatmap_svgs["beta"].selectAll("#title")
                          .text(make_macula_msg(d.snip, "beta"));
      heatmap_svgs["pvalue"].selectAll("#title")
                            .text(make_macula_msg(d.snip, "pvalue"));
    }
    var manhattan_tooltip = function(e, d) {
      // remove old tooltips
      d3.select("#div_tooltip").selectAll(".tooltip").remove();

      d3.select("#div_tooltip")
         .append("div")
         .attr("class", "tooltip")
         .style("visibility", "visible")
         .style("opacity", 1)
         //.style("left", (d3.mouse(this)[0] +10) +"px")
         //.style("top", (d3.mouse(this)[1] +10) +"px")
         .style("left", (e.pageX +10) +"px")
         .style("top", (e.pageY +10) +"px")
         .text(d.snip +": beta="+d3.format(".2f")(d.beta) +"; pvalue="+d3.format(".0e")(d.pvalue) )
    }

    // Build Y scales and axis:
    manhattan_x = make_manhattan_x(sdata, snip);
    var myAxis = make_manhattan_xAxis(sdata, manhattan_x);
    manhattan_svg.append("g")
                 .attr("id", "xaxis")
                .attr("class", "axis")
                .call(myAxis)
                .attr("transform",`translate(${0}, ${height})`);

    manhattan_y = make_manhattan_y(sdata, snip);
    manhattan_svg.append("g")
                 .attr("id", "yaxis")
                 .call(d3.axisLeft(manhattan_y).ticks(3).tickFormat(d3.format(".0e")));

    // Build color scale
    const cmin = d3.quantile(d3.map(sdata, d=>d.pvalue), 0.05);
    const cmax = d3.quantile(d3.map(sdata, d=>d.pvalue), 0.95);
    console.log("cmin:" +cmin)
    console.log("cmax:" +cmax)
    // 1 color shade and different heatmap colors!
    manhattan_color = d3.scaleSequential()
                        .interpolator(d3.interpolateBlues)
                        .domain([cmax, Number.MIN_VALUE]);

    manhattan_svg.append('g')
        .selectAll("dot")
        .data(sdata)
        .enter()
        .append("text")
          .attr("class", "scattertext")
          .attr("x", function (d) { return manhattan_x(d.pos) + 5; } )
          .attr("y", function (d) { return manhattan_y(d.pvalue) - 5; } )
          .attr("text-anchor", "start")
      .attr("transform", d => "rotate(-45 " + manhattan_x(d.pos) + " " + manhattan_y(d.pvalue) + " ) ")
      .text(label_snips)

    manhattan_svg.append('g')
        .selectAll("dot")
        .data(sdata)
        .enter()
        .append("circle")
          .attr("cx", function (d) { return manhattan_x(d.pos); } )
          .attr("cy", function (d) { return manhattan_y(d.pvalue); } )
          .attr("r", 5)
          .style("fill", d=> manhattan_color(d.pvalue))
      .on("mouseover", manhattan_tooltip)
      .on("mousemove", manhattan_mousemove)
      .on("mousedown", manhattan_mouseclick);
    
    // Add title to graph
    manhattan_svg.append("text")
      .attr("id", "title")
      .attr("x", 0)
      .attr("y", -50)
      .attr("text-anchor", "left")
      //.style("font-size", "22px")
      .attr("class", "h5")
      .text(make_manhattan_msg(xs, ys, snip));
  }
  function make_manhattan_x(sdata, snip=null) {
    if (snip==null) {
      manhattan_x = d3.scaleLinear()
                      .range([ 0, width ])
                      .domain([snip_info_data[0].pos, snip_info_data[snip_info_data.length-1].pos]);
    } else {
      let sdata_pos = d3.map(sdata, function(d){return d.pos; });
      let min_pos = d3.min(sdata_pos);
      let max_pos = d3.max(sdata_pos);
      manhattan_x = d3.scaleLinear()
                      .range([ 0, width ])
                      .domain([min_pos, max_pos]);
    }
    return manhattan_x;
  }
  function make_manhattan_y(sdata, snip=null) {
    const sdata_pvalues = d3.map(sdata, function(d){return d.pvalue; })
    const max_pval = d3.max(sdata_pvalues)*100; 
    let min_pval = d3.min(sdata_pvalues); 
    min_pval = min_pval==0 ? Number.MIN_VALUE:min_pval/10;
    manhattan_y = d3.scaleLog()
                    .range([ height, 0 ])
                    .domain([max_pval, min_pval])
    return manhattan_y;
  }
  function make_manhattan_xAxis(sdata, manhattan_x) {
    var sdata_sorted = sdata.sort((a,b) => a.pos -b.pos);

    var num_loc_data = sdata.length;
    var num_ticks = 5;
    var tickPoints = [];
    var ticks = [];  // use 4 positions mostly linearly spaced; can be locus coords in future
    if (num_ticks>num_loc_data) {
      tickPoints = sdata_sorted;
      ticks = d3.map(sdata_sorted, d=> d.pos);
    } else {
      for (let i=0; i<num_ticks; i++) {
        let cur_point = sdata_sorted[Math.floor((i/num_ticks)*num_loc_data)];
        tickPoints.push(cur_point);
        ticks.push(cur_point.pos);
      }
    }
    var myAxis = d3.axisBottom()
                   .scale(manhattan_x)
                   .tickValues(ticks)
                   .tickFormat(function(d,i){ return tickPoints[i].chr +";" +tickPoints[i].pos });
    return myAxis;
  }

  async function change_manhattan(xs, ys, snip=null) {
    console.log("in change_manhattan; xs:" +xs, "; ys:" +ys);
    
    // get new location data
    cur_xs = xs;
    cur_ys = ys;
    await get_loc_data();
    var sdata = loc_data;
    
    var target_suffix = snip==null ? "full":"zoom";
    var manhattan_svg = manhattan_svgs[target_suffix];
    if (snip!=null) {
      let cur_snip_info = snip_info_dict[snip];
      sdata = d3.filter(loc_data, d => { return Math.abs(d.pos - cur_snip_info.pos) < 500000 });
    }

    //manhattan_x = d3.scaleLinear().range([ 0, width ]).domain([snip_info_data[0].pos, snip_info_data[snip_info_data.length-1].pos]);
    manhattan_x = make_manhattan_x(sdata, snip);    
    var myAxis = make_manhattan_xAxis(sdata, manhattan_x);
    manhattan_svg.select("g#xaxis")
                 .call(myAxis)
                 .attr("transform",`translate(${0}, ${height})`);

    manhattan_y = make_manhattan_y(sdata, snip);
    manhattan_svg.select("g#yaxis")
                 .call(d3.axisLeft(manhattan_y).ticks(3).tickFormat(d3.format(".0e")));
    manhattan_svg.append("text")
                 .attr("text-anchor", "end")
                 .attr("transform", "rotate(-90)")
                 .attr("y", -margin.left+10)
                 .attr("x", -margin.top+85)
                 .text("p-value")

    manhattan_svg.selectAll("#title")
                 .text(make_manhattan_msg(xs, ys, snip));

    // redraw
    manhattan_svg.selectAll("circle")
                  .data(sdata)
                  .join()
                    .attr("cx", function (d) { return manhattan_x(d.pos); } )
                    .attr("cy", function (d) { return manhattan_y(d.pvalue); } )
                    .attr("r", 5)
                 .style("fill", d=> manhattan_color(d.pvalue));

    manhattan_svg.selectAll(".scattertext")
                  .data(sdata)
                  .join()
                    .attr("x", function (d) { return manhattan_x(d.pos) + 5; } )
                    .attr("y", function (d) { return manhattan_y(d.pvalue) - 5; } )
                    .attr("transform", d => "rotate(-45 " + manhattan_x(d.pos) + " " + manhattan_y(d.pvalue) + " ) ")
                    .text(label_snips)
	}
  
  function label_snips(d) {
    console.log("in label_snips: " + d);
    if (d.pvalue < manhattan_thresh) { 
      return d.snip; 
    } else { 
      return ""; 
    } 
  }

  // chart titles
  function make_macula_msg(snip, fieldName) {
    let display_text;    
    let msg;
    switch(fieldName) {
      case "beta":
        display_text = "Effect Size";
        msg = "Heatmap of " +display_text +" on Macula by " +snip;
        break;
      case "pvalue":
        display_text = "p-value";
        msg = "Heatmap of " +display_text +" on Macula by " +snip;
        break;
      case "meanThick":
        display_text = "Mean Retinal Thickness";
        msg = "Heatmap of " +display_text;
        break;
    }
    if (freeze_mac) {
      msg += " (Locked - click a SNP to unlock)";
    }
    return msg;
  }
  function make_manhattan_msg(xs, ys, snip) {
    cur_xs = xs;
    cur_ys = ys;
    let msg = snip!=null ? "Focused ":"";
    msg += "Manhattan for grid location: " +xs +", " +ys;
    if (freeze_manhattan) {
      msg += " (Locked - click a heatmap to unlock)";
    }
    return msg;
  }
  function make_bar_msg(xs, ys) {
    cur_xs = xs;
    cur_ys = ys;
    let msg = "Bar for grid location: " +xs +", " +ys;
    if (freeze_manhattan) {
      msg += " (Locked - click a heatmap to unlock)";
    }
    return msg;
  }
  
render();

// filter function
function filterSnips() {
  // Declare variables
  var input, filter, table, tr, td, i, txtValue, tbody_new, tbody_old;
  input = document.getElementById("myInput");
  filter = input.value.toLowerCase();
  table = document.getElementById("myTable");
  tbody_old = table.tBodies[0];
  tbody_new = document.createElement("tbody");
  
  var filtered_snips = d3.filter(snips_summary_data, d => { return d.snip.indexOf(filter) > -1 });
  table.style.display = "";
  // add snips matching search
  if (filtered_snips.length==0) {
    tr = document.createElement("tr");
    td = document.createElement("td");
    td.innerHTML = "No matching snips found";
    let td_colspan = document.createAttribute("colspan");
    td_colspan.value=3;
    td.setAttributeNode(td_colspan);
    tr.appendChild(td);
    tbody_new.appendChild(td);
    //table.appendChild(tr);
    tbody_old.parentNode.replaceChild(tbody_new, tbody_old);
  } else {
    for (let i=0; i<Math.min(filtered_snips.length, 10); i++) {
      tr = document.createElement("tr");
      td = document.createElement("td");
      td.innerHTML = filtered_snips[i].snip;
      tr.appendChild(td);
      td = document.createElement("td");
      td.innerHTML = filtered_snips[i].chr;
      tr.appendChild(td);
      td = document.createElement("td");
      td.innerHTML = d3.format(".2%")(filtered_snips[i].num_sig/NUM_GRID_POINTS);
      tr.appendChild(td);
      
      let tr_event = document.createAttribute("onclick");
      tr_event.value = "on_snip_click('" +filtered_snips[i].snip +"')";
      tr.setAttributeNode(tr_event);
      tbody_new.appendChild(tr);
    }    
    tbody_old.parentNode.replaceChild(tbody_new, tbody_old);
  }
}

function on_snip_click(snip) {
  console.log(snip);
  // UI
  var input = document.getElementById("myInput");
  input.value = snip;
  var table = document.getElementById("myTable");
  table.style.display = "none"; // hide table
  
  // repaint heatmaps
  change_macula(snip, "beta");
  change_macula(snip, "pvalue");
}
</script>
